name: Vercel

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  preview:
    name: Preview deployment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel preview environment
        run: npx --yes vercel@59.5.0 pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel preview output
        run: npx --yes vercel@59.5.0 build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Vercel preview output
        run: npx --yes vercel@59.5.0 deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  production:
    name: Production deployment
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel production environment
        run: npx --yes vercel@59.5.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel production output
        run: npx --yes vercel@59.5.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Vercel production output
        run: npx --yes vercel@59.5.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
